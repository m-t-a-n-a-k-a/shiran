[package]
name = "shiran"
version = "0.1.0"
edition = "2024"
description = "A bounded, schema-less snapshot of Linux /proc and /sys."

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
